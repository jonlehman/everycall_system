name: client-ui-v2-monitoring

on:
  schedule:
    - cron: "15 16 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      APP_BASE_URL: https://app.everycall.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Verify production version endpoint
        run: |
          set -euo pipefail
          mkdir -p monitoring-logs
          echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > monitoring-logs/run-metadata.txt
          echo "base_url=${APP_BASE_URL}" >> monitoring-logs/run-metadata.txt
          curl -sS "${APP_BASE_URL}/api/version" | tee monitoring-logs/api-version.json

      - name: Run client-ui v2 API monitoring suite
        run: |
          set -euo pipefail
          corepack pnpm test:client-ui:v2:api 2>&1 | tee monitoring-logs/test-client-ui-v2-api.log

      - name: Run client-ui v2 E2E monitoring suite
        run: |
          set -euo pipefail
          corepack pnpm test:client-ui:v2:e2e 2>&1 | tee monitoring-logs/test-client-ui-v2-e2e.log

      - name: Upload monitoring artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-ui-v2-monitoring-${{ github.run_number }}
          path: monitoring-logs/
          if-no-files-found: error
          retention-days: 14

      - name: Open incident issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Client UI v2 monitoring failed: run ${context.runNumber}`;
            const body = [
              "Automated CU14 monitoring detected a failure.",
              "",
              `- Workflow run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Commit: ${context.sha}`,
              `- Trigger: ${context.eventName}`,
              "",
              "Please inspect logs and artifacts, then triage against CU14 escalation triggers."
            ].join("\n");
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["monitoring", "cu14", "incident"]
              });
            } catch (error) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
