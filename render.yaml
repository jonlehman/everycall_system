services:
  - type: web
    name: everycall-call-gateway
    env: docker
    dockerfilePath: apps/call-gateway/Dockerfile
    autoDeploy: true
    envVars:
      - key: PORT
        value: "3101"
      - key: TELNYX_PUBLIC_KEY
        sync: false
      - key: TELNYX_API_KEY
        sync: false
      - key: TELNYX_TRANSCRIPTION_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_REALTIME_MODEL
        sync: false
      - key: OPENAI_REALTIME_VOICE
        sync: false
      - key: OPENAI_REALTIME_INPUT_FORMAT
        sync: false
      - key: OPENAI_REALTIME_OUTPUT_FORMAT
        sync: false
      - key: TELNYX_RTP_PAYLOAD_TYPE
        sync: false
      - key: TELNYX_BIDIRECTIONAL_PAYLOAD_MODE
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: CALL_SUMMARY_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
  - type: worker
    name: everycall-worker
    env: docker
    dockerfilePath: apps/worker/Dockerfile
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: TELNYX_API_KEY
        sync: false
      - key: MAILTRAP_TOKEN
        sync: false
      - key: MAILTRAP_SENDER_EMAIL
        sync: false
      - key: MAILTRAP_SENDER_NAME
        sync: false
      - key: WORKER_POLL_INTERVAL_MS
        value: "3000"
      - key: WORKER_CLAIM_LIMIT
        value: "10"
